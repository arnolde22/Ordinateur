name: Windows Runner Test

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:

      - name: Vérifier le système Windows
        shell: powershell
        run: |
          Write-Host "====================================="
          Write-Host "       WINDOWS RUNNER"
          Write-Host "====================================="
          Write-Host "Ordinateur : $env:COMPUTERNAME"
          Write-Host "Utilisateur : $env:USERNAME"
          Write-Host "Architecture : $env:PROCESSOR_ARCHITECTURE"
          Write-Host "Version Windows :"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

      - name: Vérifier PowerShell
        shell: powershell
        run: |
          Write-Host "====================================="
          Write-Host "       POWERSHELL"
          Write-Host "====================================="
          Write-Host "Version PowerShell :"
          $PSVersionTable.PSVersion

      - name: Vérifier le dossier temporaire
        shell: powershell
        run: |
          Write-Host "====================================="
          Write-Host "       DOSSIER TEMPORAIRE"
          Write-Host "====================================="

          $tempFile = Join-Path $env:TEMP "github-test.txt"

          "GitHub Actions fonctionne correctement." |
            Out-File -FilePath $tempFile -Encoding UTF8

          Write-Host "Fichier créé :"
          Write-Host $tempFile

          Write-Host ""
          Write-Host "Contenu :"
          Get-Content $tempFile

          Remove-Item $tempFile -Force

      - name: Tester le téléchargement HTTPS
        shell: powershell
        run: |
          Write-Host "====================================="
          Write-Host "       TEST HTTPS"
          Write-Host "====================================="

          $testUrl = "https://www.google.com"
          $testFile = Join-Path $env:TEMP "https-test.html"

          Invoke-WebRequest `
            -Uri $testUrl `
            -OutFile $testFile

          if (Test-Path $testFile) {
            Write-Host "Téléchargement HTTPS réussi."
            Write-Host "Fichier : $testFile"
          }
          else {
            Write-Error "Le téléchargement a échoué."
            exit 1
          }

          Remove-Item $testFile -Force

      - name: Vérifier les commandes réseau
        shell: powershell
        run: |
          Write-Host "====================================="
          Write-Host "       TEST RÉSEAU"
          Write-Host "====================================="

          Write-Host "Adresse IP :"
          Get-NetIPAddress -AddressFamily IPv4 |
            Where-Object {
              $_.IPAddress -notlike "127.*" -and
              $_.IPAddress -notlike "169.254.*"
            } |
            Select-Object IPAddress, InterfaceAlias

          Write-Host ""
          Write-Host "Connectivité Internet :"

          $connection = Test-NetConnection `
            -ComputerName "www.google.com" `
            -Port 443

          if ($connection.TcpTestSucceeded) {
            Write-Host "Connexion HTTPS réussie."
          }
          else {
            Write-Error "La connexion HTTPS a échoué."
            exit 1
          }

      - name: Vérification finale
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "====================================="
          Write-Host "       TEST TERMINÉ"
          Write-Host "====================================="
          Write-Host "Toutes les vérifications ont réussi."
          Write-Host "Le runner Windows fonctionne correctement."
